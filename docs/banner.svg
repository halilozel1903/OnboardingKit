<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="OnboardingKit: onboarding and What's New screens for SwiftUI" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06140f"/>
      <stop offset="1" stop-color="#0f1734"/>
    </linearGradient>
    <radialGradient id="blob1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blob2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3f3ea"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="screenPad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdebd3"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34b27a"/>
      <stop offset="1" stop-color="#1e8c5c"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffab3d"/>
      <stop offset="1" stop-color="#f28a0c"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="560" fill="url(#bg)"/>
  <circle cx="860" cy="150" r="240" fill="url(#blob1)" filter="url(#blur)"/>
  <circle cx="1160" cy="450" r="220" fill="url(#blob2)" filter="url(#blur)"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="80" y="225" fill="#ffffff" font-size="68" font-weight="800" letter-spacing="-2">OnboardingKit</text>
    <text x="82" y="280" fill="#cbd5e1" font-size="27" font-weight="500">Onboarding and What's New for SwiftUI</text>
    <text x="82" y="316" fill="#94a3b8" font-size="21" font-weight="500">iPhone · iPad · Mac</text>
    <g font-size="19" font-weight="600">
      <rect x="82" y="350" width="164" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="164" y="376" fill="#e2e8f0" text-anchor="middle">.onboarding()</text>
      <rect x="258" y="350" width="144" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="330" y="376" fill="#e2e8f0" text-anchor="middle">What's New</text>
      <rect x="82" y="402" width="150" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="157" y="428" fill="#e2e8f0" text-anchor="middle">Liquid Glass</text>
      <rect x="244" y="402" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="296" y="428" fill="#e2e8f0" text-anchor="middle">Swift 6</text>
      <rect x="360" y="402" width="80" height="40" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="400" y="428" fill="#e2e8f0" text-anchor="middle">SPM</text>
    </g>

    <!-- iPad: a page of the paged intro, two columns -->
    <g transform="translate(40 0)">
    <g filter="url(#shadow)">
      <rect x="760" y="70" width="440" height="330" rx="26" fill="#1c1f26" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    </g>
    <rect x="772" y="82" width="416" height="306" rx="16" fill="url(#screenPad)"/>
    <rect x="1112" y="98" width="58" height="24" rx="12" fill="#f28a0c" fill-opacity="0.15"/>
    <text x="1141" y="115" fill="#d9770a" font-size="12" font-weight="700" text-anchor="middle">Skip</text>
    <rect x="812" y="160" width="120" height="120" rx="32" fill="url(#orange)"/>
    <g fill="#ffffff">
      <circle cx="878" cy="190" r="10"/>
      <path d="M870 204 L886 204 L892 236 L884 236 L880 220 L872 256 L862 256 L870 222 L862 236 L856 232 Z"/>
      <rect x="896" y="200" width="4" height="58" rx="2" transform="rotate(12 898 229)"/>
    </g>
    <text x="966" y="200" fill="#111827" font-size="21" font-weight="800">Track every step</text>
    <text x="966" y="228" fill="#6b7280" font-size="14">Record distance, pace and</text>
    <text x="966" y="248" fill="#6b7280" font-size="14">elevation, even without signal.</text>
    <g>
      <rect x="941" y="322" width="8" height="8" rx="4" fill="#9ca3af" fill-opacity="0.5"/>
      <rect x="955" y="322" width="24" height="8" rx="4" fill="#f28a0c"/>
      <rect x="985" y="322" width="8" height="8" rx="4" fill="#9ca3af" fill-opacity="0.5"/>
    </g>
    <rect x="900" y="344" width="160" height="30" rx="15" fill="#f28a0c"/>
    <text x="980" y="364" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Continue</text>
    </g>

    <!-- iPhone: the welcome screen with a feature list -->
    <g transform="translate(70 0)">
    <g filter="url(#shadow)">
      <rect x="640" y="150" width="210" height="390" rx="38" fill="#1c1f26" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    </g>
    <rect x="650" y="160" width="190" height="370" rx="30" fill="url(#screen)"/>
    <rect x="715" y="170" width="60" height="16" rx="8" fill="#111827"/>
    <rect x="722" y="200" width="46" height="46" rx="13" fill="url(#green)"/>
    <path d="M730 236 L741 216 L748 227 L753 220 L762 236 Z" fill="#ffffff"/>
    <text x="745" y="274" fill="#111827" font-size="19" font-weight="800" text-anchor="middle">Welcome to</text>
    <text x="745" y="297" fill="#1e8c5c" font-size="19" font-weight="800" text-anchor="middle">Trailmark</text>

    <g font-size="10.5">
      <rect x="668" y="318" width="24" height="24" rx="7" fill="#1e8c5c" fill-opacity="0.15"/>
      <path d="M673 336 L673 324 L679 322 L685 324 L689 322 L689 334 L685 336 L679 334 Z" fill="none" stroke="#1e8c5c" stroke-width="1.6" stroke-linejoin="round"/>
      <text x="702" y="328" fill="#111827" font-weight="700">Offline maps</text>
      <text x="702" y="341" fill="#6b7280">Navigate with no signal.</text>

      <rect x="668" y="356" width="24" height="24" rx="7" fill="#1e8c5c" fill-opacity="0.15"/>
      <path d="M672 375 L678 367 L682 371 L689 361" fill="none" stroke="#1e8c5c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="702" y="366" fill="#111827" font-weight="700">Elevation profiles</text>
      <text x="702" y="379" fill="#6b7280">See each climb first.</text>

      <rect x="668" y="394" width="24" height="24" rx="7" fill="#1e8c5c" fill-opacity="0.15"/>
      <circle cx="677" cy="403" r="4" fill="#f5b50b"/>
      <path d="M676 413 Q676 407 682 407 Q684 403 688 406 Q691 407 690 413 Z" fill="#1e8c5c"/>
      <text x="702" y="404" fill="#111827" font-weight="700">Summit weather</text>
      <text x="702" y="417" fill="#6b7280">Hourly, for the top.</text>

      <rect x="668" y="432" width="24" height="24" rx="7" fill="#1e8c5c" fill-opacity="0.15"/>
      <path d="M680 436 L688 439 L688 446 Q688 452 680 455 Q672 452 672 446 L672 439 Z" fill="#1e8c5c"/>
      <path d="M676 446 L679 449 L684 443" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="702" y="442" fill="#111827" font-weight="700">Safety check-ins</text>
      <text x="702" y="455" fill="#6b7280">Tell someone you're back.</text>
    </g>

    <rect x="668" y="480" width="154" height="32" rx="16" fill="#1e8c5c"/>
    <rect x="668" y="480" width="154" height="16" rx="8" fill="#ffffff" fill-opacity="0.12"/>
    <text x="745" y="501" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Continue</text>
    </g>
  </g>
</svg>
